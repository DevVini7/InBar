<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050711">
  <title>Inbar — Mapa</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/place-card.css">
  <link rel="stylesheet" href="css/map-controls.css">
  <link rel="stylesheet" href="css/profile-menu.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="Voltar ao início do Inbar">
      <svg class="brand-logo" viewBox="0 0 180 60" role="img" aria-label="Inbar">
        <defs>
          <linearGradient id="brandPurple" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#f329ff"></stop>
            <stop offset="1" stop-color="#8c12ff"></stop>
          </linearGradient>

          <filter
            id="brandGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
          >
            <feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur>

            <feMerge>
              <feMergeNode in="blur"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>

        <path
          class="brand-mark"
          d="M29 4C16.3 4 6 14.3 6 27c0 14.5 16.9 27.1 23 32 6.1-4.9 23-17.5 23-32C52 14.3 41.7 4 29 4Z"
          fill="url(#brandPurple)"
          filter="url(#brandGlow)"
        ></path>

        <path
          d="M29 11.5c-8.3 0-15 6.7-15 15 0 8.8 9.2 17.4 15 22.2 5.8-4.8 15-13.4 15-22.2 0-8.3-6.7-15-15-15Z"
          fill="#080914"
        ></path>

        <path
          d="M21 19h16l-8 10-8-10Zm8 10v9m-5 0h10m-8 4h6"
          fill="none"
          stroke="url(#brandPurple)"
          stroke-width="2.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        ></path>

        <text
          x="61"
          y="40"
          font-family="Inter, Arial, sans-serif"
          font-size="29"
          font-weight="800"
          letter-spacing="-1.7"
        ><tspan fill="url(#brandPurple)">in</tspan><tspan fill="#f7f8ff">bar</tspan></text>
      </svg>
    </a>
    <nav class="main-nav" aria-label="Navegação principal">
      <button class="nav-link active" data-page="Mapa">Mapa</button>
      <button class="nav-link" data-page="Explorar">Explorar</button>
      <button class="nav-link" data-page="Feed">Feed</button>
      <button class="nav-link" data-page="Missões">Missões</button>
    </nav>
    <form class="search" id="searchForm" role="search">
      <svg class="icon search-icon" aria-hidden="true">
        <use href="assets/icons.svg#search"></use>
      </svg>
      <input id="searchInput" type="search" placeholder="Buscar lugares, bairros..." autocomplete="off" aria-controls="searchResults" aria-expanded="false">
      <button class="clear-search" type="button" id="clearSearch" aria-label="Limpar busca">
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons.svg#x"></use>
        </svg>
      </button>
      <div class="search-results hidden" id="searchResults" role="listbox" aria-label="Resultados da busca"></div>
    </form>
    <div class="profile-menu-wrap">
      <button class="avatar-button" id="profileButton" aria-label="Abrir menu do perfil" aria-haspopup="menu" aria-expanded="false" aria-controls="profileMenu">
      <svg class="icon" aria-hidden="true">
        <use href="assets/icons.svg#user-round"></use>
      </svg>
      </button>
      <div class="profile-menu hidden" id="profileMenu" role="menu" aria-label="Menu do perfil">
        <p class="profile-menu-title">Minha conta</p>
        <button type="button" role="menuitem">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#ticket-percent"></use></svg>
          Meus cupons
        </button>
        <button type="button" role="menuitem">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#settings-2"></use></svg>
          Personalização
        </button>
        <div class="profile-menu-divider"></div>
        <button type="button" role="menuitem" class="profile-sign-out">Sair</button>
      </div>
    </div>
  </header>

  <main class="map-shell">
    <div id="map" role="region" aria-label="Mapa interativo do Plano Piloto de Brasília"></div>
    <div class="sr-only" id="mapStatus" role="status" aria-live="polite"></div>
    <aside class="filters" aria-label="Filtros de lugares">
      <button class="filter active" data-filter="Todos">
        <span class="filter-icon">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#list-filter"></use>
          </svg>
        </span>
        <span class="filter-label">Todos</span>
      </button>
      <button class="filter" data-filter="Bares">
        <span class="filter-icon">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#beer"></use>
          </svg>
        </span>
        <span class="filter-label">Bares</span>
      </button>
      <button class="filter" data-filter="Boates">
        <span class="filter-icon">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#headphones"></use>
          </svg>
        </span>
        <span class="filter-label">Boates</span>
      </button>
      <button class="filter" data-filter="Eventos">
        <span class="filter-icon">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#calendar-days"></use>
          </svg>
        </span>
        <span class="filter-label">Eventos</span>
      </button>
      <button class="filter" data-filter="Música ao vivo">
        <span class="filter-icon">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#music-2"></use>
          </svg>
        </span>
        <span class="filter-label">Música ao vivo</span>
      </button>
      <button class="filter" data-filter="Happy Hour">
        <span class="filter-icon">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#tag"></use>
          </svg>
        </span>
        <span class="filter-label">Happy Hour</span>
      </button>
      <button class="filter" data-filter="Hobbies">
        <span class="filter-icon">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#gamepad-2"></use>
          </svg>
        </span>
        <span class="filter-label">Hobbies</span>
      </button>
    </aside>

    <section class="place-card hidden" id="placeCard" aria-live="polite">
      <button class="card-arrow" id="nextPlace" aria-label="Próximo lugar">
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons.svg#chevron-right"></use>
        </svg>
      </button>
      <button class="card-close" id="closeCard" aria-label="Fechar detalhes">
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons.svg#x"></use>
        </svg>
      </button>
      <div class="place-gallery">
        <img class="place-image" id="placeImage" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=360&h=420&fit=crop" alt="Ambiente do estabelecimento">
        <div class="detail-gallery hidden" id="detailGallery" aria-label="Fotos do local"></div>
      </div>
      <div class="place-info">
        <h2 id="placeName">Villa Lounge</h2>
        <p class="rating hidden" id="placeRating">
          <svg class="icon rating-icon" aria-hidden="true">
            <use href="assets/icons.svg#star"></use>
          </svg>
          <strong id="placeScore"></strong>
          <span id="placeReviews"></span>
        </p>
        <p class="distance" id="placeDistance">1,8 km • Asa Sul</p>
        <p class="status">
          <span class="status-dot" id="statusDot"></span>
          <strong id="placeStatus">Movimentado agora</strong>
        </p>
        <p class="stat">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#users-round"></use>
          </svg>
          <span><b id="placeOccupancy">70%</b> de ocupação</span>
        </p>
        <p class="stat">
          <svg class="icon" aria-hidden="true">
            <use href="assets/icons.svg#images"></use>
          </svg>
          <span><b id="placePosts">12</b> publicações recentes</span>
        </p>
        <div class="detail-highlights hidden" id="detailHighlights">
          <div class="feature-list" id="featureList" aria-label="Destaques do local"></div>
          <div class="promotion">
            <svg class="icon promotion-icon" aria-hidden="true">
              <use href="assets/icons.svg#ticket-percent"></use>
            </svg>
            <div>
              <strong>Oferta especial</strong>
              <small id="promotionText"></small>
            </div>
          </div>
        </div>
        <button
          class="details-button"
          id="detailsButton"
          aria-expanded="false"
          aria-controls="expandedDetails"
        >
          Ver detalhes
        </button>
      </div>
      <div class="expanded-details hidden" id="expandedDetails">
        <section class="recent-posts" aria-labelledby="postsTitle">
          <div class="section-heading">
            <h3 id="postsTitle">Publicações recentes</h3>
            <button class="text-button" id="allPosts">
              Ver todas
              <svg class="icon" aria-hidden="true">
                <use href="assets/icons.svg#arrow-right"></use>
              </svg>
            </button>
          </div>
          <div class="post-list" id="postList"></div>
        </section>
        <div class="detail-actions">
          <button class="feed-button" id="feedButton">
            <svg class="icon" aria-hidden="true">
              <use href="assets/icons.svg#images"></use>
            </svg>
            Ver feed do local
          </button>
          <a
            class="directions-button"
            id="directionsLink"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg class="icon" aria-hidden="true">
              <use href="assets/icons.svg#navigation"></use>
            </svg>
            Como chegar
          </a>
        </div>
      </div>
    </section>

    <div class="legend">
      <span><i class="legend-dot green"></i>Tranquilo</span>
      <span><i class="legend-dot yellow"></i>Movimentado</span>
      <span><i class="legend-dot red"></i>Lotado</span>
    </div>

    <div class="map-controls">
      <button
        id="locateButton"
        title="Minha localização"
        aria-label="Minha localização"
      >
        <svg class="icon" aria-hidden="true">
          <use href="assets/icons.svg#locate-fixed"></use>
        </svg>
      </button>
      <div class="zoom-controls">
        <button id="zoomIn" aria-label="Aumentar zoom">+</button>
        <button id="zoomOut" aria-label="Diminuir zoom">−</button>
      </div>
    </div>
    <button class="my-location" id="myLocation">
      <svg class="icon" aria-hidden="true">
        <use href="assets/icons.svg#navigation"></use>
      </svg>
      Minha localização
    </button>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/places.js"></script>
  <script src="js/map.js"></script>
  <script src="js/place-card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
